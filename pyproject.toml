[project]
name = "fuel-route-optimizer"
version = "1.0.0"
description = "Django API that plans the cheapest fuel stops for a US road trip."
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = ["live: hits the real OSRM / Nominatim services (deselect with -m 'not live')"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["fuel_planner/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]
